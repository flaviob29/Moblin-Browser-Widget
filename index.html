<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moblin GPS Overlay</title>

<!-- Mappa OpenStreetMap -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
}

.overlay {
    position: relative;
    width: 430px;
    height: 330px;
    background: transparent;
}

/* MAPPA CIRCOLARE */
.map-wrap {
    position: absolute;
    top: 0;
    right: 2;
    width: 250px;
    height: 220px;
    border-radius: 50%;
    overflow: hidden;
    background: #20262b;
    box-shadow: 0 3px 16px rgba(0,0,0,.42);
}

#map {
    width: 100%;
    height: 100%;
    filter: brightness(.78) contrast(1.08) saturate(.62);
}

.location-dot {
    position: absolute;
    z-index: 999;
    left: 50%;
    top: 50%;
    width: 13px;
    height: 13px;
    margin: -6.5px;
    border-radius: 50%;
    background: #18e6ed;
    box-shadow: 0 0 0 5px rgba(24,230,237,.16), 0 0 14px rgba(24,230,237,.85);
}

/* CITTA' */
.city {
    position: absolute;
    z-index: 1000;
    right: 240px;
    top: 228px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 10px;
    border-radius: 8px;
    background: rgba(18,18,18,.88);
    color: white;
    font-size: 17px;
    font-weight: 650;
    line-height: 1;
    white-space: nowrap;
}

.flag {
    font-size: 19px;
}

/* BARRA DATI */
.stats {
    position: absolute;
    left: 0;
    top: 262px;
    display: flex;
    align-items: center;
    gap: 0;
    height: 36px;
    border-radius: 8px;
    overflow: hidden;
    background: rgba(18,18,18,.90);
    color: white;
    white-space: nowrap;
}

.stat {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    font-size: 18px;
    font-weight: 500;
    line-height: 1;
}

.stat + .stat {
    border-left: 1px solid rgba(255,255,255,.16);
}

.icon {
    font-size: 18px;
}

#status {
    position: absolute;
    left: 3px;
    top: 305px;
    color: rgba(255,255,255,.65);
    font-size: 10px;
}
</style>
</head>

<body>
<div class="overlay">

    <div class="map-wrap">
        <div id="map"></div>
        <div class="location-dot"></div>
    </div>

    <div class="city">
        <span class="flag" id="flag">🇮🇹</span>
        <span id="city">Ricerca posizione...</span>
    </div>

    <div class="stats">
        <div class="stat">
            <span class="icon" id="weatherIcon">☾</span>
            <span id="temperature">-- °C</span>
        </div>

        <div class="stat">
            <span class="icon">📏</span>
            <span id="distance">0,0 km</span>
        </div>

        <div class="stat">
            <span class="icon">⛰</span>
            <span id="elevation">-- m</span>
        </div>
    </div>

    <div id="status">GPS in attesa...</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let marker;
let firstPosition = null;
let lastPosition = null;
let totalDistance = 0;

function distanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const p1 = lat1 * Math.PI / 180;
    const p2 = lat2 * Math.PI / 180;
    const dp = (lat2-lat1) * Math.PI / 180;
    const dl = (lon2-lon1) * Math.PI / 180;

    const a = Math.sin(dp/2)**2 +
              Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2)**2;

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function initMap(lat, lon) {
    if (map) return;

    map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        touchZoom: false
    }).setView([lat, lon], 13);

    // Basemap scura in stile "night map", simile allo screenshot.
    // Le mappe sono fornite da CARTO e basate sui dati OpenStreetMap.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    marker = L.circleMarker([lat, lon], {
        radius: 5,
        color: '#18e6ed',
        fillColor: '#18e6ed',
        fillOpacity: 1,
        weight: 0
    }).addTo(map);
}

async function updateWeather(lat, lon) {
    try {
        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
            `&current=temperature_2m,is_day,weather_code&timezone=auto`;

        const r = await fetch(url, {cache: 'no-store'});
        const d = await r.json();

        const temp = Math.round(d.current.temperature_2m);
        document.getElementById('temperature').textContent = `${temp} °C`;

        const isDay = d.current.is_day === 1;
        document.getElementById('weatherIcon').textContent = isDay ? '☀' : '☾';
    } catch(e) {}
}

async function updateElevation(lat, lon) {
    try {
        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
            `&hourly=elevation&forecast_days=1&timezone=auto`;

        const r = await fetch(url, {cache: 'no-store'});
        const d = await r.json();

        if (d.elevation !== undefined) {
            document.getElementById('elevation').textContent =
                `${Math.round(d.elevation)} m`;
        } else if (d.hourly && d.hourly.elevation) {
            document.getElementById('elevation').textContent =
                `${Math.round(d.hourly.elevation[0])} m`;
        }
    } catch(e) {}
}

async function updateCity(lat, lon) {
    try {
        const url =
            `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=10&accept-language=it`;

        const r = await fetch(url, {
            cache: 'no-store',
            headers: {'Accept': 'application/json'}
        });

        const d = await r.json();
        const a = d.address || {};

        const name =
            a.city ||
            a.town ||
            a.village ||
            a.municipality ||
            a.county ||
            'Posizione GPS';

        document.getElementById('city').textContent = name;

        const country = (a.country_code || '').toLowerCase();
        if (country === 'it') {
            document.getElementById('flag').textContent = '🇮🇹';
        } else if (country) {
            document.getElementById('flag').textContent = '🌍';
        }
    } catch(e) {
        document.getElementById('city').textContent = 'Posizione GPS';
    }
}

function updatePosition(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    if (!firstPosition) {
        firstPosition = {lat, lon};
        lastPosition = {lat, lon};
    } else {
        const step = distanceKm(lastPosition.lat, lastPosition.lon, lat, lon);

        // Evita che piccoli errori GPS facciano aumentare troppo il contatore.
        if (step > 0.005 && step < 2) {
            totalDistance += step;
            lastPosition = {lat, lon};
        }
    }

    document.getElementById('distance').textContent =
        `${totalDistance.toFixed(1).replace('.', ',')} km`;

    if (!map) {
        initMap(lat, lon);
    } else {
        map.setView([lat, lon], map.getZoom(), {animate: false});
        if (marker) marker.setLatLng([lat, lon]);
    }

    updateWeather(lat, lon);
    updateElevation(lat, lon);
    updateCity(lat, lon);

    document.getElementById('status').textContent = 'GPS attivo';
}

function gpsError(error) {
    document.getElementById('status').textContent =
        'GPS non disponibile';
    document.getElementById('city').textContent = 'GPS non disponibile';
}

if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(
        updatePosition,
        gpsError,
        {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 15000
        }
    );
} else {
    document.getElementById('status').textContent = 'GPS non supportato';
}
</script>
</body>
</html>
