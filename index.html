<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBS - Ora e Temperatura</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
    }

    .overlay {
        width: 360px;
        height: 90px;
        box-sizing: border-box;
        padding: 8px 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: transparent;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        text-shadow: 0 1px 3px rgba(0,0,0,.55);
    }

    .time {
        font-size: 30px;
        line-height: 1;
        font-weight: 400;
        letter-spacing: -1px;
    }

    .temp {
        margin-top: 10px;
        margin-left: -10px;
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        gap: 7px;
        padding: 5px 11px;
        border-radius: 22px;
        background: rgba(75, 75, 75, 0.88);
        color: white;
        font-size: 20px;
        line-height: 1;
        font-weight: 600;
        text-shadow: none;
        white-space: nowrap;
    }

    .flag { font-size: 18px; line-height: 1; }
    .moon { font-size: 24px; line-height: 1; }
    .city { font-weight: 650; }

    .status {
        display: none;
    }
</style>
</head>
<body>
<div class="overlay">
    <div class="time" id="time">--:--</div>
    <div class="temp">
        <span class="flag">🇮🇹</span>
        <span class="city">Ponsacco</span>
        <span class="moon">☾</span>
        <span id="tempValue">-- °C</span>
    </div>
</div>

<div class="status" id="status"></div>

<script>
    // Località: Ponsacco (PI)
    const LAT = 43.6235;
    const LON = 10.6250;

    function updateClock() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('time').textContent = `${hh}:${mm}`;
    }

    async function updateWeather() {
        try {
            const url =
                `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
                `&current=temperature_2m&timezone=Europe%2FRome`;

            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) throw new Error('Weather request failed');

            const data = await response.json();
            const temperature = Math.round(data.current.temperature_2m);
            document.getElementById('tempValue').textContent = `${temperature} °C`;
            document.querySelector('.moon').textContent = data.current.is_day === 1 ? '☀' : '☾';
        } catch (error) {
            document.getElementById('tempValue').textContent = '-- °C';
        }
    }

    updateClock();
    updateWeather();

    setInterval(updateClock, 1000);
    setInterval(updateWeather, 5 * 60 * 1000);
</script>
</body>
</html>
